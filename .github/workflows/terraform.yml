name: Terraform

on:
  pull_request:
    paths:
      - "*.tf"
      - ".terraform.lock.hcl"
      - "environments/**"
      - "modules/**"
      - "scripts/bootstrap-terraform-state.*"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - develop
    paths:
      - "*.tf"
      - ".terraform.lock.hcl"
      - "environments/**"
      - "modules/**"
      - "scripts/bootstrap-terraform-state.*"
      - ".github/workflows/terraform.yml"

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_environment: dev
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_frontend_bucket_name: ${{ secrets.FRONTEND_BUCKET }}
  TF_VAR_lambda_name: ${{ secrets.LAMBDA_FUNCTION_NAME }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
  TF_VAR_route53_hosted_zone_id: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Write backend config
        run: |
          cat <<EOF > backend.auto.hcl
          bucket         = "${{ vars.TF_STATE_BUCKET }}"
          key            = "serverless/dev/terraform.tfstate"
          region         = "${{ secrets.AWS_REGION }}"
          dynamodb_table = "${{ vars.TF_LOCK_TABLE }}"
          encrypt        = true
          EOF

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend-config=backend.auto.hcl

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: terraform apply -auto-approve tfplan
